<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outreach Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <div class="header-text">
          <h1 class="app-name">Outreach Tracker</h1>
          <p class="app-sub">LinkedIn Profile Capture</p>
        </div>
        <div class="status-dot" id="status-indicator"></div>
      </div>
      <div class="header-glow"></div>
    </header>

    <!-- Content Area -->
    <div id="content-container">

      <!-- Loading State -->
      <div id="loading" class="state-panel">
        <div class="loading-orb">
          <div class="orb-ring"></div>
          <div class="orb-ring orb-ring-2"></div>
          <svg class="orb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
        </div>
        <p class="state-title">Scanning profile…</p>
        <p class="state-sub">Extracting LinkedIn data</p>
      </div>

      <!-- Not LinkedIn State -->
      <div id="not-linkedin" class="state-panel hidden">
        <div class="state-icon-wrap warning">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="26" height="26">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </div>
        <p class="state-title">No Profile Detected</p>
        <p class="state-sub">Navigate to a LinkedIn profile page to capture their info</p>
        <div class="hint-chip">
          <span>linkedin.com/in/username</span>
        </div>
      </div>

      <!-- Profile Card State -->
      <div id="profile-card" class="state-panel hidden">

        <!-- Profile Hero -->
        <div class="profile-hero">
          <div class="avatar-ring">
            <div class="avatar-wrap">
              <span id="avatar-fallback" class="avatar-fallback">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="28" height="28">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <img id="profile-avatar" class="avatar-img hidden" alt="Profile" />
            </div>
          </div>
          <div class="profile-meta">
            <h2 id="profile-name" class="pname">Loading...</h2>
            <p id="profile-title" class="ptitle"></p>
            <p id="profile-company" class="pcompany"></p>
          </div>
          <a id="profile-link" href="#" target="_blank" class="li-btn" title="View on LinkedIn">
            <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
              <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
            </svg>
          </a>
        </div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Form Fields -->
        <div class="form-stack">

          <div class="field-group">
            <label class="field-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="11" height="11">
                <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
              </svg>
              Company
            </label>
            <input type="text" id="company-input" class="field-input" placeholder="Company name..." autocomplete="off" />
          </div>

          <div class="field-group">
            <label class="field-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="11" height="11">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
              </svg>
              Pipeline Stage
            </label>
            <div class="select-wrap">
              <select id="stage-select" class="field-select">
                <option value="to_reach_out">📬 To Reach Out</option>
                <option value="connected">🤝 Connected</option>
                <option value="replied">💬 Replied</option>
                <option value="meeting_booked">📅 Meeting Booked</option>
                <option value="in_discussion">🔥 In Discussion</option>
              </select>
              <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>
          </div>

          <div class="field-group">
            <label class="field-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="11" height="11">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
              </svg>
              Notes
            </label>
            <textarea id="notes-input" class="field-textarea" placeholder="Outreach angle, how you know them..."></textarea>
          </div>
        </div>

        <!-- CTA Button -->
        <button id="send-btn" class="cta-btn">
          <div class="cta-glow"></div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" stroke-linecap="round">
            <path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/>
          </svg>
          <span>Load into Dashboard</span>
        </button>

        <!-- Success / Error feedback -->
        <div id="status-message" class="status-msg hidden"></div>

      </div>
    </div>

    <!-- Footer: Direct quick-link to hosted dashboard on GitHub Pages -->
    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-dot"></div>
        <!-- Link points directly to your live hosted GitHub Pages dashboard -->
        <a href="https://nidhishh.github.io/linkedin_outreach_tracker/" target="_blank" class="footer-link" id="dashboard-link">
          <span>Open Dashboard</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="11" height="11">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </a>
      </div>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
