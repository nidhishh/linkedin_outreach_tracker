name: Deploy to GitHub Pages

# Trigger deployment automatically on every push to the main branch
on:
  push:
    branches:
      - main
  # Allow triggering the workflow manually from GitHub's Actions tab
  workflow_dispatch:

# Set minimal required permissions for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the source code from this repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js runtime environment (version 20 LTS)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Install dependencies cleanly from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Step 4: Build the production bundle into the /dist directory
      - name: Build project
        run: npm run build

      # Step 5: Configure GitHub Pages runner environment
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Step 6: Package the compiled /dist folder for deployment
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # Step 7: Deploy the artifact directly to GitHub Pages CDN
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
